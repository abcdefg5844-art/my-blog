<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 블로그</title>
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <script>
    // 화면 깜빡임을 막기 위해 CSS보다 먼저 테마를 정한다
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="list">
  <header class="site-header">
    <div class="container">
      <a class="site-title" href="./">나의 블로그</a>
      <button class="theme-toggle" type="button" aria-label="다크 모드 켜기" aria-pressed="false">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="page-intro">
      <h1>글 목록</h1>
      <p>배운 것과 생각한 것을 기록합니다.</p>
    </section>
    <ul class="post-list" id="post-list"></ul>
    <p class="status-message" id="status" role="status">글을 불러오는 중…</p>

    <section class="apps" aria-labelledby="apps-title">
      <h2 class="section-title" id="apps-title">미니 웹앱</h2>
      <ul class="app-list">
        <li>
          <article class="app-card">
            <h3><a href="apps/2048/">2048</a></h3>
            <p>방향키나 스와이프로 타일을 합쳐 2048을 만드는 퍼즐 게임</p>
            <div class="app-frame">
              <iframe src="apps/2048/" title="2048 게임" loading="lazy"></iframe>
            </div>
            <a class="app-open" href="apps/2048/">전체 화면으로 열기 →</a>
          </article>
        </li>
        <li>
          <article class="app-card">
            <h3><a href="apps/pixel-editor/">픽셀 아트 에디터</a></h3>
            <p>16×16 격자에 도트를 찍어 그림을 그리고 PNG로 저장하는 에디터</p>
            <div class="app-frame">
              <iframe src="apps/pixel-editor/" title="픽셀 아트 에디터" loading="lazy"></iframe>
            </div>
            <a class="app-open" href="apps/pixel-editor/">전체 화면으로 열기 →</a>
          </article>
        </li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© 나의 블로그</div>
  </footer>
</body>
</html>
