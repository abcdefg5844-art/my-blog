<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048</title>
  <meta name="description" content="방향키나 스와이프로 타일을 합쳐 2048을 만드는 퍼즐 게임">
  <script>
    // 화면 깜빡임을 막기 위해 CSS보다 먼저 테마를 정한다(블로그와 같은 방식)
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <h1 class="title">2048</h1>
      <div class="scores">
        <div class="score-box">
          <span class="score-label">점수</span>
          <span class="score-value" id="score">0</span>
          <span class="score-pops" id="score-pops" aria-hidden="true"></span>
        </div>
        <div class="score-box">
          <span class="score-label">최고</span>
          <span class="score-value" id="best">0</span>
        </div>
      </div>
    </header>

    <div class="sub">
      <p class="desc">방향키나 스와이프로 타일을 합쳐 <strong>2048</strong>을 만드세요.</p>
      <button type="button" class="btn" id="new-game">새 게임</button>
    </div>

    <div class="board-area">
      <div class="board-wrap">
        <div class="board" id="board" tabindex="0" role="group" aria-label="2048 게임 보드" aria-describedby="board-desc">
          <div class="grid" aria-hidden="true">
            <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
            <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
            <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
            <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
          </div>
          <div class="tiles" id="tiles" aria-hidden="true"></div>
        </div>

        <div class="overlay" id="win-overlay" role="dialog" aria-modal="true" aria-labelledby="win-title" hidden>
          <p class="overlay-title" id="win-title">2048 달성!</p>
          <div class="overlay-actions">
            <button type="button" class="btn" id="continue">계속하기</button>
            <button type="button" class="btn btn-secondary" id="win-new-game">새 게임</button>
          </div>
        </div>

        <div class="overlay" id="over-overlay" role="dialog" aria-modal="true" aria-labelledby="over-title" hidden>
          <p class="overlay-title" id="over-title">게임 오버</p>
          <p class="overlay-text">최종 점수 <strong id="final-score">0</strong>점</p>
          <div class="overlay-actions">
            <button type="button" class="btn" id="retry">다시 하기</button>
          </div>
        </div>
      </div>
    </div>

    <p class="hint">방향키 · WASD 또는 보드를 스와이프해 움직입니다.</p>

    <p class="sr-only" id="board-desc"></p>
    <div class="sr-only" id="status" aria-live="polite"></div>
    <div class="sr-only" id="alert" role="alert"></div>
  </main>
</body>
</html>
