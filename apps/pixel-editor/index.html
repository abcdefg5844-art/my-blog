<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>픽셀 아트 에디터</title>
  <meta name="description" content="16×16 격자에 도트를 찍어 그리고 PNG로 저장하는 그림판">
  <script>
    // 화면 깜빡임을 막기 위해 CSS보다 먼저 테마를 정한다(블로그와 같은 방식)
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <h1 class="title">픽셀 아트 에디터</h1>
      <p class="current" id="current">
        <span class="sr-only">현재 상태:</span>
        <span class="current-swatch" id="current-swatch" aria-hidden="true"></span>
        <span id="current-text">펜</span>
      </p>
    </header>
    <p class="desc">칸을 누르거나 드래그해 그리고, PNG로 저장하세요.</p>

    <div class="workspace">
      <div class="board-area">
        <div class="board show-grid" id="board" tabindex="0" role="group" aria-label="16×16 그림판" aria-describedby="board-help"></div>
        <p class="toast" id="toast" aria-hidden="true" hidden></p>
      </div>

      <div class="panel">
        <div class="tools" role="group" aria-label="도구">
          <button type="button" class="btn tool" id="tool-pen" data-tool="pen" aria-pressed="true" aria-label="펜" title="펜 (B)" aria-keyshortcuts="B">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20l1.2-4.6L15.6 5a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8 4 20z" /><path d="M13.5 7l3.5 3.5" /></svg>
            <span class="btn-label">펜</span>
          </button>
          <button type="button" class="btn tool" id="tool-eraser" data-tool="eraser" aria-pressed="false" aria-label="지우개" title="지우개 (E)" aria-keyshortcuts="E">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8.5 19.5L3.7 14.7a1.5 1.5 0 0 1 0-2.1l8.9-8.9a1.5 1.5 0 0 1 2.1 0l5.6 5.6a1.5 1.5 0 0 1 0 2.1l-8.2 8.1H8.5z" /><path d="M8 9l7 7" /><path d="M12 19.5h8" /></svg>
            <span class="btn-label">지우개</span>
          </button>
          <button type="button" class="btn tool" id="tool-fill" data-tool="fill" aria-pressed="false" aria-label="채우기" title="채우기 (F)" aria-keyshortcuts="F">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 3.5l8 8-6.5 6.5a2 2 0 0 1-2.8 0L3.5 12.8a2 2 0 0 1 0-2.8L10 3.5z" /><path d="M3.8 11.5h13.7" /><path d="M20 15.5s1.8 2.2 1.8 3.4a1.8 1.8 0 0 1-3.6 0c0-1.2 1.8-3.4 1.8-3.4z" /></svg>
            <span class="btn-label">채우기</span>
          </button>
          <button type="button" class="btn" id="undo" aria-label="되돌리기" title="되돌리기 (Ctrl+Z)" aria-keyshortcuts="Control+Z Meta+Z" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 14L4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
            <span class="btn-label">되돌리기</span>
          </button>
          <button type="button" class="btn" id="redo" aria-label="다시 실행" title="다시 실행 (Ctrl+Shift+Z 또는 Ctrl+Y)" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z Control+Y" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 14l5-5-5-5" /><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" /></svg>
            <span class="btn-label">다시 실행</span>
          </button>
        </div>

        <div class="palette" id="palette" role="group" aria-label="색상 팔레트">
          <label class="swatch custom" id="custom-swatch" title="사용자 색 고르기">
            <span class="custom-color" id="custom-color" aria-hidden="true"></span>
            <input type="color" class="color-input" id="color-input" value="#ff7043" aria-label="사용자 색 고르기, 현재 #ff7043">
            <span class="custom-text" aria-hidden="true">사용자 색</span>
          </label>
        </div>

        <div class="bottom-row">
          <div class="actions">
            <button type="button" class="btn" id="grid-toggle" aria-pressed="true" aria-label="격자선" title="격자선 표시 (G)" aria-keyshortcuts="G">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="4" width="16" height="16" rx="1" /><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16" /></svg>
              <span class="btn-label">격자선</span>
            </button>
            <button type="button" class="btn" id="clear" aria-label="전체 지우기" title="전체 지우기" disabled>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16" /><path d="M9 7V4.5h6V7" /><path d="M6 7l1 13h10l1-13" /></svg>
              <span class="btn-label">전체 지우기</span>
            </button>
          </div>

          <div class="export">
            <label class="scale-label" for="scale"><span class="scale-text">배율</span></label>
            <select class="scale" id="scale">
              <option value="1">1×</option>
              <option value="8">8×</option>
              <option value="16" selected>16×</option>
              <option value="32">32×</option>
            </select>
            <button type="button" class="btn btn-primary" id="save">PNG 저장</button>
          </div>
        </div>
      </div>
    </div>

    <p class="sr-only" id="board-help">방향키로 칸을 옮기고 Space 또는 Enter로 현재 도구를 적용합니다. Shift와 방향키를 함께 누르면 움직이면서 칠합니다. Home과 End는 행의 처음과 끝으로 이동합니다. 단축키: B 펜, E 지우개, F 채우기, G 격자선, Ctrl+Z 되돌리기, Ctrl+Shift+Z 또는 Ctrl+Y 다시 실행.</p>
    <div class="sr-only" id="status" aria-live="polite"></div>
  </main>
</body>
</html>
